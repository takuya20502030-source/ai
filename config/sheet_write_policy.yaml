    "構造タグ別": {mode: read_only}
    "クラス別": {mode: read_only}
    "Coverage miss": {mode: read_only}
    "Quality miss": {mode: read_only}
    "結果検証11項目": {mode: read_only}
    "Dashboard": {mode: read_only}
    "Rules": {mode: read_only}
    "Sources": {mode: read_only}
