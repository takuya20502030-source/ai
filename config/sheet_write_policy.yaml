        - "Version / 版"
        - "Change / 変更種別"
        - "Detail / 内容"
        - "Reason / 理由"
        - "Block Impact / ブロック影響"

    # --- 完全READ ONLY(この方針変更時もwhitelistではなくmode自体で保護する) ---
    "FORCED-ALL": {mode: read_only}
    "SELECT-B+": {mode: read_only}
