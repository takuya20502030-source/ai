# 既存Google Sheets(RIN_GARDEN_Keirin_Virtual_Ledger_v2.1)の実タブ構成に基づく
# ヘッダー行位置の設定。
#
# 2026-08-16のREAD ONLY調査(`python -m rin_garden sheets-raw-inspect`)で
# ユーザーのローカル環境から実際に取得したタブ構成をもとに記載している
# (このリポジトリ側で推測・捏造した値ではない)。タブごとにバナー行・空行・
# 説明文行の深さが異なり単純な「1行目=ヘッダー」という前提が成立しないため、
# 自動推定はせずここで明示的に管理する。
#
# header_row_index: 0始まりの行インデックス(0 = シートの1行目)。
#   例: Race Ledgerは 1行目=バナー、2行目=空、3行目=説明文、4行目=実ヘッダー
#       なので header_row_index: 3 (0,1,2,3 の4番目=4行目)。
#
# ここに記載の無いタブは、sheets-formula-inspect実行時にheader_row_index無し
# (列ごとのヘッダー名を付けずに集計のみ)として扱われる。実際の数式構造は
# まだ未確認のため、このファイルは「行位置の設定」のみを扱い、
# どの列が数式か・書き込み候補かはREAD ONLY調査結果を見てから判断すること。
#
# ============================================================================
# ARCHIVE NOTICE (2026-08-16時点)
# ============================================================================
# RIN GARDEN Google Sheets正本は v3.0 へ全面移行した。以下の
# `keirin_v2_1_archive:` セクションは旧 RIN_GARDEN_Keirin_Virtual_Ledger_v2.1
# のヘッダー行位置(ARCHIVE ONLY、参照専用)。実行時のsport識別子は意図的に
# "keirin" ではなく "keirin_v2_1_archive" にしている。
# load_header_row_index_map(path, "keirin") は現在このファイルから何も取得
# できず、空({})を返す(=Adapterはheader_row_index未設定として
# HeaderMismatchErrorで安全に拒否する。誤って古い行位置がv3.0へ適用される
# ことはない)。v3.0用の行位置は、v3.0タブ構成をREAD ONLYで確認してから
# 別セクション("keirin:")として追記すること。
# ============================================================================

keirin_v2_1_archive:
  "Race Ledger": {header_row_index: 3}
  "FORCED-ALL": {header_row_index: 3}
  "SELECT-B+": {header_row_index: 3}
  "FLEX-ALL": {header_row_index: 3}
  "FLEX-SELECT": {header_row_index: 3}
  "Tickets": {header_row_index: 2}
  "Coverage": {header_row_index: 3}
  "Race Log": {header_row_index: 2}
  "日別": {header_row_index: 3}
  "変更履歴": {header_row_index: 3}
